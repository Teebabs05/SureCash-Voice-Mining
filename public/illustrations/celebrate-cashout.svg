<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Illustration of three people celebrating a cash withdrawal">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="billGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16D17E"/>
      <stop offset="100%" stop-color="#0A8C53"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="100" r="120" fill="url(#glow)"/>

  <!-- confetti -->
  <g opacity="0.9">
    <rect x="40" y="40" width="8" height="8" rx="2" fill="#0D8A82" transform="rotate(20 44 44)"/>
    <rect x="330" y="55" width="8" height="8" rx="2" fill="#F5A623" transform="rotate(-15 334 59)"/>
    <circle cx="70" cy="90" r="5" fill="#E2497A"/>
    <circle cx="355" cy="110" r="5" fill="#12B76A"/>
    <rect x="300" y="30" width="7" height="7" rx="2" fill="#12B76A" transform="rotate(35 303 33)"/>
    <rect x="60" y="140" width="7" height="7" rx="2" fill="#F5A623" transform="rotate(10 63 143)"/>
    <circle cx="320" cy="150" r="4" fill="#0D8A82"/>
    <circle cx="30" cy="115" r="4" fill="#F5A623"/>
    <rect x="370" y="80" width="6" height="6" rx="2" fill="#E2497A" transform="rotate(-20 373 83)"/>
  </g>

  <!-- ground shadows -->
  <ellipse cx="95" cy="238" rx="38" ry="7" fill="#000000" opacity="0.08"/>
  <ellipse cx="200" cy="246" rx="46" ry="8" fill="#000000" opacity="0.1"/>
  <ellipse cx="308" cy="238" rx="38" ry="7" fill="#000000" opacity="0.08"/>

  <!-- flying cash bills above center figure -->
  <g>
    <rect x="150" y="15" width="30" height="18" rx="3" fill="url(#billGreen)" transform="rotate(-18 165 24)"/>
    <text x="165" y="27" transform="rotate(-18 165 24)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#ffffff">N</text>

    <rect x="185" y="4" width="30" height="18" rx="3" fill="url(#billGreen)" transform="rotate(4 200 13)"/>
    <text x="200" y="16" transform="rotate(4 200 13)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#ffffff">N</text>

    <rect x="222" y="14" width="30" height="18" rx="3" fill="url(#billGreen)" transform="rotate(20 237 23)"/>
    <text x="237" y="26" transform="rotate(20 237 23)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#ffffff">N</text>
  </g>

  <!-- Person B (left, amber shirt, fist pump) -->
  <g>
    <rect x="80" y="150" width="14" height="55" rx="6" fill="#0A2E2A"/>
    <rect x="102" y="150" width="14" height="55" rx="6" fill="#0A2E2A"/>
    <rect x="72" y="110" width="52" height="60" rx="18" fill="#F5A623"/>
    <rect x="55" y="88" width="15" height="42" rx="7" fill="#F5A623" transform="rotate(-25 62 109)"/>
    <circle cx="50" cy="82" r="9" fill="#C68642"/>
    <rect x="112" y="120" width="14" height="30" rx="7" fill="#C68642" transform="rotate(20 119 135)"/>
    <circle cx="98" cy="92" r="20" fill="#C68642"/>
    <circle cx="91" cy="90" r="2.2" fill="#10201D"/>
    <circle cx="104" cy="90" r="2.2" fill="#10201D"/>
    <path d="M90 99 Q98 104 106 99" stroke="#10201D" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Person A (center, main, teal shirt, holding cash up) -->
  <g>
    <rect x="178" y="160" width="17" height="62" rx="7" fill="#062723"/>
    <rect x="205" y="160" width="17" height="62" rx="7" fill="#062723"/>
    <rect x="167" y="108" width="66" height="72" rx="22" fill="#0D8A82"/>
    <rect x="150" y="55" width="17" height="60" rx="8" fill="#0D8A82" transform="rotate(-32 158 85)"/>
    <rect x="233" y="55" width="17" height="60" rx="8" fill="#0D8A82" transform="rotate(32 242 85)"/>
    <circle cx="145" cy="52" r="10" fill="#8A5A3C"/>
    <circle cx="255" cy="52" r="10" fill="#8A5A3C"/>
    <circle cx="200" cy="88" r="24" fill="#8A5A3C"/>
    <circle cx="192" cy="85" r="2.6" fill="#10201D"/>
    <circle cx="208" cy="85" r="2.6" fill="#10201D"/>
    <path d="M190 96 Q200 103 210 96" stroke="#10201D" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Person C (right, coral shirt, jazz hands) -->
  <g>
    <rect x="284" y="150" width="14" height="55" rx="6" fill="#3A0F1F"/>
    <rect x="306" y="150" width="14" height="55" rx="6" fill="#3A0F1F"/>
    <rect x="276" y="110" width="52" height="60" rx="18" fill="#E2497A"/>
    <rect x="325" y="88" width="15" height="42" rx="7" fill="#E2497A" transform="rotate(25 332 109)"/>
    <circle cx="348" cy="82" r="9" fill="#3D2B1F"/>
    <rect x="266" y="120" width="14" height="30" rx="7" fill="#3D2B1F" transform="rotate(-20 273 135)"/>
    <circle cx="302" cy="92" r="20" fill="#3D2B1F"/>
    <circle cx="295" cy="90" r="2.2" fill="#10201D"/>
    <circle cx="308" cy="90" r="2.2" fill="#10201D"/>
    <path d="M294 99 Q302 104 310 99" stroke="#10201D" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
